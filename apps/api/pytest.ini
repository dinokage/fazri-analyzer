[pytest]
# Pytest configuration for backend tests

# Set Python path to include backend directory
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 6.0

# Add verbose output by default
addopts =
    -v
    --strict-markers
    --tb=short
    -W ignore::DeprecationWarning:pydantic._internal._config

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    auth: Authentication tests
    slow: Slow-running tests

# Async test configuration
asyncio_mode = auto

# Test paths
testpaths = tests

# Ignore patterns
norecursedirs = .git .venv venv __pycache__ *.egg-info

# Coverage options (when using --cov)
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */.venv/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
